<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batta Venkateswara Rao</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF1F1;
    --ink:#14171C;
    --ink-soft:#5B6169;
    --blue:#2A4FE0;
    --line:#D3D9DC;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px;
  }
  .center{
    text-align:center;
    max-width:420px;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--blue);
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-bottom:20px;
  }
  .eyebrow::before{
    content:"";
    width:7px; height:7px;
    border-radius:50%;
    background:var(--blue);
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(28px, 5vw, 38px);
    letter-spacing:-0.01em;
    margin-bottom:10px;
  }
  .role{
    color:var(--ink-soft);
    font-size:14px;
    margin-bottom:36px;
  }
  .scholar-link{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:16px 32px;
    background:var(--ink);
    color:var(--paper);
    border-radius:2px;
    font-size:14.5px;
    font-weight:500;
    text-decoration:none;
    transition:background .2s ease;
  }
  .scholar-link:hover{background:var(--blue);}
  .scholar-link svg{width:14px; height:14px;}
</style>
</head>
<body>

<div class="center">
  <div class="eyebrow">Computer Science · M.S. Student</div>
  <h1>Batta Venkateswara Rao</h1>
  <p class="role">New England College</p>
  <a class="scholar-link" href="https://scholar.google.com/citations?user=THQQZQwAAAAJ&hl=en" target="_blank" rel="noopener">
    Google Scholar
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M7 17L17 7M17 7H8M17 7V16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>
</div>

</body>
</html>
